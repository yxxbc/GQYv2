name: PR 标准检查

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

jobs:
  pr-standards:
    name: pr-standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # zizmor artipacked：不把 GITHUB_TOKEN 留在 .git/config 里
          persist-credentials: false
      - name: 校验提交与变更日志
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          SKIP_CHANGELOG_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: bash scripts/check-pr-standards.sh "$BASE_SHA" "$HEAD_SHA" "$PR_TITLE" "$SKIP_CHANGELOG_LABEL"