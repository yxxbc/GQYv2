[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"          # 与 version.txt / .release-please-manifest.json 当前值一致
edition = "2024"
rust-version = "1.98.1"    # 与 rust-toolchain.toml 的 channel 同一数值（P00-01）
publish = false

[workspace.lints.rust]
unsafe_code = "deny"       # 仅 gqy-sys 允许模块级 allow + // SAFETY:（01 §6；豁免在 P07-04 落地时按需添加）
