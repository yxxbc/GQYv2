[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.4.0"          # 与 version.txt 同步；发布 PR 由 release-please-config.json 的 extra-files 一起更新
edition = "2024"
rust-version = "1.98.1"    # 与 rust-toolchain.toml 的 channel 同一数值（P00-01）
publish = false

[workspace.lints.rust]
unsafe_code = "deny"       # 仅 gqy-sys 允许模块级 allow + // SAFETY:（01 §6；豁免在 P07-04 落地时按需添加）
missing_docs = "deny"      # 公开项必须有文档（19 §6.1 第 3 项；P00-03）

[workspace.lints.clippy]
# 19 §6.1 第 2 项的全量名单（P00-03）。测试代码的放开策略见各 crate 的 cfg(test) 头部。
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
let_underscore_must_use = "deny"   # 吞错误：let _ = result（19 §6.1）
unused_result_ok = "deny"          # 吞错误：result.ok(); 只是压掉 must_use 警告（19 §6.1）
await_holding_lock = "deny"
large_futures = "deny"
missing_errors_doc = "deny"        # # Errors 一节（AGENTS.md 注释规范）
missing_panics_doc = "deny"        # # Panics 一节（AGENTS.md 注释规范）
disallowed_methods = "deny"        # 名单在 clippy.toml（Runtime::new / block_on / unbounded_channel，02 §2）

[workspace.dependencies]
# 跨 crate 共享的依赖版本集中在这里（P00-05 首次落地）；各 crate 用 `workspace = true` 引用。
tokio = { version = "1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
thiserror = "2"
