[package]
name = "gqy-cli"
description = "命令行的头：gqy ask，最薄的头，也是协议的参考实现（施工 3-9 下）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# 参数。
clap = { version = "4", features = ["derive"] }
# 请求编号的随机前缀：两次 gqy ask 不撞号。
getrandom = { version = "0.4", features = ["std"] }
# 连上核心，没在跑就拉起来（施工 3-8 下、3-9 上）。
gqy-ipc = { path = "../gqy-ipc" }
# 工具结果里给人看的说法（施工 4-5 下）。
gqy-kernel = { path = "../gqy-kernel" }
# 值写成 TOML：`gqy config get`、`explain` 印的值（施工 8-2）。
gqy-config = { path = "../gqy-config" }
# 数据根、环境快照；给人看的字。
gqy-store = { path = "../gqy-store" }
# `gqy sandbox setup`、`remove`：Windows 上装好、撤掉沙盒用户（施工 5-8）。
gqy-sandbox = { path = "../gqy-sandbox" }
# `gqy login`、`gqy setup` 贴 key 时自己管终端的设置（施工 8-5 补，`config.md` 第十一条第 4 条）：Unix 上关
# ECHO、ISIG、ICANON 读 termios；工作区里本来就有（`gqy-basesystem`、`gqy-fs`、`gqy-ipc` 用过别的功能）。
rustix = { version = "1", features = ["termios"] }
# 协议是 JSON-RPC 2.0，一行一条（04-核心协议.md P1）。
serde_json = "1.0"
# 终端、控制台的设置写不回去时记一行，不吞掉也不 panic（施工 8-5 补）；工作区里本来就有。
tracing = { version = "0.1", default-features = false, features = ["std"] }
# 连接是异步的；Ctrl+C；`--timeout` 的钟（施工 7-9）。
tokio = { version = "1", features = ["io-util", "macros", "rt", "signal", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
# `gqy sandbox setup` 替谁装：当前用户的 SID（施工 5-8）。
gqy-pipe = { path = "../gqy-pipe" }
# 贴 key 时关控制台的回显、行输入、`Ctrl+C` 的处理（施工 8-5 补）：工作区里本来就有（`gqy-ipc`、`gqy-pipe`、
# `gqy-sandbox` 用别的功能）。
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
# 测试贴 key 的真实现：守卫本身的单元测试要一对真的伪终端（施工 8-5 补）。
rustix = { version = "1", features = ["termios", "pty"] }
# 测试里在进程里起核心：照出厂档案造的路由（施工 8-6，没配模型时的端口）。
gqy-core = { path = "../gqy-core" }
# 测试里在进程里起核心：协议端点。
gqy-endpoint = { path = "../gqy-endpoint" }
# 测试里请求模型照剧本回。
gqy-session = { path = "../gqy-session", features = ["testkit"] }
# 测试里在进程里起核心：工具目录（施工 4-1）。
gqy-tool = { path = "../gqy-tool" }
# 测试里 `gqy setup` 的供应商、本机的服务是假服务器（施工 8-11）。
gqy-http = { path = "../gqy-http", features = ["testkit"] }
# 测试里核心的模型资料：真目录裁出来的一份、档案（施工 8-11）。
gqy-models = { path = "../gqy-models" }
# 测试里在进程里起核心：真的工具经 cargo 编出来的助手执行命令（施工 5-4 上）。
gqy-sandbox = { path = "../gqy-sandbox", features = ["testkit"] }
tokio = { version = "1", features = ["io-util", "macros", "rt", "signal", "sync", "time"] }

# Cargo 不许 `workspace = true` 以后再单改一条：这里照抄工作区的（改那边的，记得同步这里），只把 `unsafe_code` 从
# `forbid` 改成 `deny`：整个 crate 仍然不许，只有 Windows 上关控制台回显、`Ctrl+C` 处理那一处单独放开，写明为什么安全
# （施工 8-5 补：`src/config/console/windows.rs`）。
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "warn"

[lints.clippy]
let_underscore_must_use = "deny"
unused_result_ok = "deny"
unwrap_used = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# 每个 unsafe 块都写清为什么安全。
undocumented_unsafe_blocks = "deny"
