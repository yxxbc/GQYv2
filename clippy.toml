# clippy 的 workspace 级参数配置（P00-03）。
#
# 规则出处：19 §6.1 第 2 项（disallowed_methods 名单：Runtime::new、block_on、unbounded_channel）、
# 02 §2（runtime 只在入口二进制创建、库与组装层禁止 block_on）、铁律 5（每一次等待都有上界）。
# lint 的开启在根 Cargo.toml 的 [workspace.lints.clippy]；这里只放需要传参的规则，
# 每个 crate 通过 `[lints] workspace = true` 继承，不各自复制。
# 注意：`tokio` / `futures` 目前（P00-03）还没进依赖图，路径解析不到时不生效；
# P02 引入 tokio 后本名单立即对这四类调用生效，不需要再改代码。
disallowed-methods = [
  { path = "tokio::runtime::Runtime::new", reason = "runtime 只在入口二进制创建（02 §2）" },
  { path = "tokio::runtime::Handle::block_on", reason = "库与组装层禁止 block_on（02 §2）" },
  { path = "futures::executor::block_on", reason = "库与组装层禁止 block_on（02 §2）" },
  { path = "tokio::sync::mpsc::unbounded_channel", reason = "禁止无界通道（铁律 5）" },
]
